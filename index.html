<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Figtree',system-ui,sans-serif}
  h1{font-family:'Bricolage Grotesque',Georgia,serif}
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-teal-900 via-teal-800 to-slate-900 text-slate-800">
<main class="mx-auto max-w-xl px-4 py-8">
  <header class="mb-6 text-white">
    <h1 class="text-4xl font-extrabold tracking-tight">Strategy Log</h1>
    <p class="mt-2 text-teal-100">Write down a problem, your plan, and what really happened. Each entry becomes a row in your Google Sheet.</p>
  </header>

  <form id="f" class="space-y-5 rounded-3xl bg-white p-5 shadow-2xl sm:p-7">
    <div>
      <label for="Date" class="mb-1 block text-sm font-semibold">Date</label>
      <input type="date" id="Date" name="Date" required
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500">
    </div>

    <div>
      <label for="p" class="mb-1 block text-sm font-semibold">What is the problem/scenario</label>
      <textarea id="p" name="What is the problem/scenario" rows="3" required placeholder="Describe the situation"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div>
      <label for="s" class="mb-1 block text-sm font-semibold">What is the strategy</label>
      <textarea id="s" name="What is the strategy" rows="3" required placeholder="What will you do about it?"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div>
      <label for="e" class="mb-1 block text-sm font-semibold">What is the expected result</label>
      <textarea id="e" name="What is the expected result" rows="2" placeholder="What do you expect to happen?"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div>
      <label for="a" class="mb-1 block text-sm font-semibold">What is the actual result</label>
      <textarea id="a" name="What is the actual result" rows="2" placeholder="What actually happened? Leave blank if not known yet"
        class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <button id="btn" type="submit"
      class="w-full rounded-xl bg-amber-400 px-4 py-3.5 text-lg font-bold text-slate-900 shadow transition active:scale-[0.98] hover:bg-amber-300 disabled:opacity-60">
      Save entry
    </button>
    <p id="msg" role="status" class="min-h-6 text-center text-sm font-medium"></p>
  </form>
</main>

<script>
  // Paste your Apps Script Web app URL here (see setup steps)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxDSxNWSB9IWEFX8rVudlZJQdBsIw6Vx3MUcXQypOEwf-tL3y_NwAdmACYZ39a-hZ_y/exec';

  const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
  const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  f.Date.value = today();

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (SCRIPT_URL.startsWith('PASTE')) {
      msg.className = 'min-h-6 text-center text-sm font-medium text-red-600';
      msg.textContent = 'Add your Web app URL in index.html first.';
      return;
    }
    btn.disabled = true; btn.textContent = 'Saving...'; msg.textContent = '';
    try {
      // no-cors: Apps Script accepts the data; the browser just can't read the reply
      await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new URLSearchParams(new FormData(f)) });
      msg.className = 'min-h-6 text-center text-sm font-medium text-teal-700';
      msg.textContent = 'Saved to your sheet.';
      f.reset(); f.Date.value = today();
    } catch (err) {
      msg.className = 'min-h-6 text-center text-sm font-medium text-red-600';
      msg.textContent = 'Could not save. Check your connection and try again.';
    } finally {
      btn.disabled = false; btn.textContent = 'Save entry';
    }
  });
</script>
</body>
</html>
